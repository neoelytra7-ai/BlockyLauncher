name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Download VT323 font
        run: curl -fL -o app/src/main/assets/VT323.ttf https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: BlockyHome-apk, path: app/build/outputs/apk/debug/app-debug.apk }
